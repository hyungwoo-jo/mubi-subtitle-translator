name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test

      - name: Install Playwright Chromium
        run: |
          python -m pip install playwright==1.63.0
          python -m playwright install --with-deps chromium
      - name: Browser subtitle tests
        run: python tests/browser_check.py
      - name: Browser OAuth tests
        run: python tests/browser_oauth_check.py

      - name: Build release packages
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: out/*.zip
          retention-days: 7
